<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🍅 Pomodoro · Природа</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --accent: #ff6b6b;
    --text: #fff;
    --glass: rgba(255,255,255,0.10);
    --glass-border: rgba(255,255,255,0.22);
  }

  html, body {
    height: 100%;
    overflow: hidden;
    font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
    color: var(--text);
    background: #05080f; /* fallback, если canvas не успел */
  }

  /* ============================================================
     ЖИВОЙ ФОН — 3 слоя с ПОЛОЖИТЕЛЬНЫМИ z-index
     (иначе они прячутся под background у body)
     ============================================================ */
  #bg-layer {
    position: fixed;
    inset: 0;
    z-index: 0;                     /* ← было -3 */
    background-size: 200% 200%;
    background-position: 0% 0%;
    animation: bgFloat 40s ease-in-out infinite;
    transition: opacity 0.9s ease;
  }

  @keyframes bgFloat {
    0%, 100% { background-position: 0% 0%; }
    25%      { background-position: 100% 50%; }
    50%      { background-position: 50% 100%; }
    75%      { background-position: 0% 50%; }
  }

  #particles {
    position: fixed;
    inset: 0;
    z-index: 1;                     /* ← было -2 */
    pointer-events: none;
    display: block;
  }

  #vignette {
    position: fixed;
    inset: 0;
    z-index: 2;                     /* ← было -1 */
    pointer-events: none;
    /* мягче, чем в прошлый раз */
    background: radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 35%, rgba(0,0,0,0.45) 100%);
  }

  /* ---------------- Интерфейс ---------------- */
  .app {
    position: relative;             /* ← поднимаем над слоями фона */
    z-index: 3;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 22px;
    padding: 20px;
  }

  .title {
    font-size: 12px;
    letter-spacing: 6px;
    text-transform: uppercase;
    opacity: 0.75;
    font-weight: 300;
  }

  /* ============================================================
     ТАЙМЕРНОЕ КОЛЬЦО
     Расширенный viewBox + overflow:visible → свечение НЕ режется
     ============================================================ */
  .timer-ring {
    position: relative;
    width: min(76vw, 320px);
    height: min(76vw, 320px);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .timer-ring svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    transform: rotate(-90deg);
    overflow: visible;              /* ← критично для свечения */
  }

  .ring-bg {
    fill: none;
    stroke: rgba(255,255,255,0.13);
    stroke-width: 6;
  }

  .ring-glow {
    fill: none;
    stroke: var(--accent);
    stroke-width: 14;
    stroke-linecap: round;
    opacity: 0.28;
    filter: blur(6px);
    transition: stroke-dashoffset 0.4s linear, stroke 0.6s ease;
  }

  .ring-progress {
    fill: none;
    stroke: var(--accent);
    stroke-width: 6;
    stroke-linecap: round;
    transition: stroke-dashoffset 0.4s linear, stroke 0.6s ease;
  }

  .time {
    font-size: clamp(54px, 16vw, 88px);
    font-weight: 200;
    font-variant-numeric: tabular-nums;
    letter-spacing: 2px;
    text-shadow: 0 4px 40px rgba(0,0,0,0.6);
    z-index: 2;
  }

  .mode-label {
    position: absolute;
    bottom: 62px;
    font-size: 11px;
    letter-spacing: 4px;
    text-transform: uppercase;
    opacity: 0.85;
    z-index: 2;
  }

  .controls {
    display: flex;
    gap: 14px;
    align-items: center;
  }

  button {
    border: 1px solid var(--glass-border);
    background: var(--glass);
    color: var(--text);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-radius: 50px;
    cursor: pointer;
    transition: all 0.22s ease;
    font-family: inherit;
  }

  button:hover { background: rgba(255,255,255,0.22); transform: translateY(-2px); }
  button:active { transform: scale(0.95); }

  .btn-main {
    width: 84px; height: 84px;
    font-size: 28px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 10px 40px rgba(0,0,0,0.35);
  }

  .btn-small {
    width: 50px; height: 50px;
    font-size: 17px;
    display: flex; align-items: center; justify-content: center;
  }

  /* ---------------- Быстрое добавление времени ---------------- */
  .add-time {
    display: flex;
    gap: 8px;
    align-items: center;
    padding: 6px;
    border-radius: 40px;
    background: rgba(0,0,0,0.22);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--glass-border);
  }

  .add-time .label {
    font-size: 11px;
    letter-spacing: 1.5px;
    opacity: 0.7;
    padding: 0 4px 0 12px;
    text-transform: uppercase;
  }

  .add-btn {
    min-width: 44px;
    height: 36px;
    padding: 0 12px;
    font-size: 12px;
    letter-spacing: 0.5px;
    border-radius: 30px;
    border: none;
    background: rgba(255,255,255,0.07);
  }

  .add-btn:hover { background: rgba(255,255,255,0.20); }
  .add-btn.plus { color: #4ecdc4; }
  .add-btn.minus { color: #ff9f7a; }

  /* ---------------- Пресеты ---------------- */
  .presets {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .preset {
    padding: 8px 16px;
    font-size: 11px;
    letter-spacing: 1px;
    border-radius: 30px;
  }

  .preset.active {
    background: var(--accent);
    border-color: var(--accent);
    box-shadow: 0 0 22px var(--accent);
  }

  /* ---------------- Нижняя панель ---------------- */
  .bottom-bar {
    position: fixed;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 10px;
    z-index: 20;
  }

  .icon-btn {
    width: 44px; height: 44px;
    font-size: 17px;
    display: flex; align-items: center; justify-content: center;
  }

  .icon-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    box-shadow: 0 0 18px var(--accent);
  }

  /* ---------------- Панель настроек ---------------- */
  .settings-panel {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(12px);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
  }

  .settings-panel.open { opacity: 1; pointer-events: auto; }

  .panel-card {
    width: min(92vw, 380px);
    background: rgba(20,20,30,0.85);
    border: 1px solid var(--glass-border);
    border-radius: 24px;
    padding: 26px;
    transform: translateY(20px) scale(0.96);
    transition: transform 0.35s cubic-bezier(.2,.9,.3,1.2);
  }

  .settings-panel.open .panel-card { transform: translateY(0) scale(1); }

  .panel-title {
    font-size: 13px;
    letter-spacing: 4px;
    text-transform: uppercase;
    opacity: 0.7;
    margin-bottom: 22px;
    text-align: center;
  }

  .field {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }

  .field label { font-size: 13px; opacity: 0.85; letter-spacing: 0.5px; }

  .field input[type="number"] {
    width: 88px;
    padding: 10px 14px;
    border-radius: 12px;
    border: 1px solid var(--glass-border);
    background: rgba(255,255,255,0.06);
    color: var(--text);
    font-family: inherit;
    font-size: 15px;
    font-variant-numeric: tabular-nums;
    text-align: center;
    outline: none;
    transition: border-color 0.2s;
  }

  .field input[type="number"]:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(255,107,107,0.15);
  }

  .panel-actions { display: flex; gap: 10px; margin-top: 24px; }

  .panel-actions button {
    flex: 1;
    padding: 12px;
    border-radius: 14px;
    font-size: 13px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .panel-actions .primary {
    background: var(--accent);
    border-color: var(--accent);
    box-shadow: 0 0 22px rgba(255,107,107,0.4);
  }

  /* ---------------- Появление ---------------- */
  .app > * { animation: fadeUp 0.9s ease backwards; }
  .app > *:nth-child(1) { animation-delay: 0.05s; }
  .app > *:nth-child(2) { animation-delay: 0.15s; }
  .app > *:nth-child(3) { animation-delay: 0.25s; }
  .app > *:nth-child(4) { animation-delay: 0.35s; }
  .app > *:nth-child(5) { animation-delay: 0.45s; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(18px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ---------------- Тост ---------------- */
  .toast {
    position: fixed;
    top: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(-100px);
    padding: 12px 22px;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(14px);
    border: 1px solid var(--glass-border);
    border-radius: 40px;
    font-size: 13px;
    letter-spacing: 0.5px;
    opacity: 0;
    transition: all 0.4s cubic-bezier(.2,.9,.3,1.2);
    z-index: 200;
    pointer-events: none;
  }

  .toast.show {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
  }

  @media (max-width: 520px) {
    .add-time .label { display: none; }
    .add-time { padding: 4px; }
    .add-btn { padding: 0 8px; min-width: 40px; font-size: 11px; }
  }
</style>
</head>
<body>

<div id="bg-layer"></div>
<canvas id="particles"></canvas>
<div id="vignette"></div>

<div class="app">
  <div class="title" id="session-info">Сессия 1 из 4</div>

  <div class="timer-ring">
    <!-- Расширенный viewBox: -30 … 230 = 30px запаса на свечение -->
    <svg viewBox="-30 -30 260 260">
      <circle class="ring-bg"       cx="100" cy="100" r="92"/>
      <circle class="ring-glow"     id="ringGlow" cx="100" cy="100" r="92"/>
      <circle class="ring-progress" id="ring"     cx="100" cy="100" r="92"/>
    </svg>
    <div class="time" id="time">25:00</div>
    <div class="mode-label" id="mode">Фокус</div>
  </div>

  <div class="controls">
    <button class="btn-small" id="reset" title="Сброс (R)">↺</button>
    <button class="btn-main" id="startPause" title="Старт/Пауза (Space)">▶</button>
    <button class="btn-small" id="skip" title="Пропустить (S)">⏭</button>
  </div>

  <div class="add-time">
    <span class="label">Время</span>
    <button class="add-btn minus" data-add="-60">−1м</button>
    <button class="add-btn plus"  data-add="60">+1м</button>
    <button class="add-btn plus"  data-add="300">+5м</button>
    <button class="add-btn plus"  data-add="600">+10м</button>
  </div>

  <div class="presets">
    <button class="preset active" data-work="25" data-break="5">25 / 5</button>
    <button class="preset" data-work="50" data-break="10">50 / 10</button>
    <button class="preset" data-work="90" data-break="20">90 / 20</button>
  </div>
</div>

<div class="bottom-bar">
  <button class="icon-btn" id="soundBtn" title="Звук природы">🔇</button>
  <button class="icon-btn" id="sceneBtn" title="Сменить сцену (B)">🖼</button>
  <button class="icon-btn" id="settingsBtn" title="Настройки времени">⚙</button>
</div>

<div class="settings-panel" id="settingsPanel">
  <div class="panel-card">
    <div class="panel-title">Настройки времени</div>
    <div class="field">
      <label>Работа, мин</label>
      <input type="number" id="workInput" min="1" max="180" value="25">
    </div>
    <div class="field">
      <label>Отдых, мин</label>
      <input type="number" id="breakInput" min="1" max="60" value="5">
    </div>
    <div class="field">
      <label>Сессий до конца</label>
      <input type="number" id="sessionsInput" min="1" max="12" value="4">
    </div>
    <div class="panel-actions">
      <button id="cancelSettings">Отмена</button>
      <button class="primary" id="applySettings">Применить</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   🎨 ПРОЦЕДУРНЫЕ ФОНЫ
   ============================================================ */
const SCENES = [
  {
    name: 'Полярное сияние',
    gradient: `radial-gradient(ellipse at 30% 80%, #1a4d3a 0%, transparent 55%),
               radial-gradient(ellipse at 70% 20%, #4a2a7a 0%, transparent 50%),
               linear-gradient(160deg, #05080f 0%, #0d1f2d 40%, #1a3a2e 100%)`,
    particle: 'stars'
  },
  {
    name: 'Закат над морем',
    gradient: `radial-gradient(circle at 50% 95%, #ffd28a 0%, #f4a261 15%, #c94b4b 40%, transparent 65%),
               linear-gradient(180deg, #2c1a3e 0%, #5a1f4a 40%, #b83a4a 75%, #f4a261 100%)`,
    particle: null
  },
  {
    name: 'Глубина океана',
    gradient: `radial-gradient(ellipse at 50% 0%, #4ecdc4 0%, transparent 55%),
               linear-gradient(180deg, #001f3f 0%, #003366 45%, #005f8a 80%, #0099b8 100%)`,
    particle: 'bubbles'
  },
  {
    name: 'Ночной лес',
    gradient: `radial-gradient(ellipse at 50% 100%, #2d5a3d 0%, transparent 60%),
               linear-gradient(180deg, #0a1f12 0%, #0d2a1a 50%, #1a3a26 100%)`,
    particle: 'fireflies'
  },
  {
    name: 'Звёздное небо',
    gradient: `radial-gradient(ellipse at 50% 30%, #1a1f3a 0%, #0a0d1a 50%, #000 100%)`,
    particle: 'stars'
  },
  {
    name: 'Гроза',
    gradient: `linear-gradient(180deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%)`,
    particle: 'rain'
  },
  {
    name: 'Пустыня',
    gradient: `linear-gradient(180deg, #3a1f0a 0%, #8a4a1a 25%, #d68a3a 55%, #f4c47a 85%, #f4d58d 100%)`,
    particle: null
  },
  {
    name: 'Заснеженные горы',
    gradient: `linear-gradient(180deg, #1a2a4a 0%, #3a5a7a 35%, #7a9ab0 65%, #c8d8e0 100%)`,
    particle: 'snow'
  },
];

const bgLayer = document.getElementById('bg-layer');
const canvas  = document.getElementById('particles');
const ctx     = canvas.getContext('2d');

let sceneIndex = Math.floor(Math.random() * SCENES.length);
let currentParticles = [];
let currentParticleType = null;
let canvasW = 0, canvasH = 0;
let lastTime = performance.now();

function resizeCanvas() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvasW = window.innerWidth;
  canvasH = window.innerHeight;
  canvas.width  = canvasW * dpr;
  canvas.height = canvasH * dpr;
  canvas.style.width  = canvasW + 'px';
  canvas.style.height = canvasH + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  currentParticles = initParticles(currentParticleType, canvasW, canvasH);
}

function initParticles(type, w, h) {
  if (!type) return [];
  if (type === 'stars') {
    return Array.from({ length: 140 }, () => ({
      x: Math.random() * w, y: Math.random() * h,
      r: Math.random() * 1.4 + 0.3,
      base: Math.random() * 0.5 + 0.3,
      phase: Math.random() * Math.PI * 2,
      speed: Math.random() * 1.5 + 0.5
    }));
  }
  if (type === 'rain') {
    return Array.from({ length: 180 }, () => ({
      x: Math.random() * w, y: Math.random() * h,
      len: Math.random() * 18 + 10,
      speed: Math.random() * 500 + 400,
      alpha: Math.random() * 0.4 + 0.15
    }));
  }
  if (type === 'snow') {
    return Array.from({ length: 90 }, () => ({
      x: Math.random() * w, y: Math.random() * h,
      r: Math.random() * 2.2 + 0.6,
      speed: Math.random() * 25 + 15,
      drift: Math.random() * 30 - 15,
      phase: Math.random() * Math.PI * 2
    }));
  }
  if (type === 'fireflies') {
    return Array.from({ length: 35 }, () => ({
      x: Math.random() * w, y: Math.random() * h,
      r: Math.random() * 2 + 1.2,
      vx: (Math.random() - 0.5) * 22,
      vy: (Math.random() - 0.5) * 22,
      phase: Math.random() * Math.PI * 2,
      speed: Math.random() * 1.5 + 0.7,
      hue: 50 + Math.random() * 25
    }));
  }
  if (type === 'bubbles') {
    return Array.from({ length: 45 }, () => ({
      x: Math.random() * w, y: Math.random() * h,
      r: Math.random() * 3 + 1,
      speed: Math.random() * 30 + 15,
      drift: Math.random() * 20 - 10,
      phase: Math.random() * Math.PI * 2,
      alpha: Math.random() * 0.35 + 0.15
    }));
  }
  return [];
}

function renderParticles(dt) {
  ctx.clearRect(0, 0, canvasW, canvasH);
  const type = currentParticleType;
  if (!type) return;
  const t = performance.now() / 1000;

  if (type === 'stars') {
    for (const p of currentParticles) {
      const a = p.base + Math.sin(t * p.speed + p.phase) * 0.35;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255,255,255,${Math.max(0.05, a)})`;
      ctx.fill();
    }
  }
  else if (type === 'rain') {
    ctx.lineCap = 'round';
    for (const p of currentParticles) {
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      ctx.lineTo(p.x - 1.5, p.y + p.len);
      ctx.strokeStyle = `rgba(180,210,255,${p.alpha})`;
      ctx.lineWidth = 1;
      ctx.stroke();
      p.y += p.speed * dt;
      p.x -= 1.5 * p.speed * dt * 0.3;
      if (p.y > canvasH) { p.y = -20; p.x = Math.random() * canvasW; }
      if (p.x < -20) p.x = canvasW + 20;
    }
  }
  else if (type === 'snow') {
    for (const p of currentParticles) {
      p.x += Math.sin(t * 0.7 + p.phase) * p.drift * dt;
      p.y += p.speed * dt;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      ctx.fill();
      if (p.y > canvasH + 5) { p.y = -5; p.x = Math.random() * canvasW; }
      if (p.x < -5) p.x = canvasW + 5;
      if (p.x > canvasW + 5) p.x = -5;
    }
  }
  else if (type === 'fireflies') {
    for (const p of currentParticles) {
      p.vx += (Math.random() - 0.5) * 4 * dt;
      p.vy += (Math.random() - 0.5) * 4 * dt;
      p.vx *= 0.98; p.vy *= 0.98;
      p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.x < 0) { p.x = 0; p.vx *= -1; }
      if (p.x > canvasW) { p.x = canvasW; p.vx *= -1; }
      if (p.y < 0) { p.y = 0; p.vy *= -1; }
      if (p.y > canvasH) { p.y = canvasH; p.vy *= -1; }
      const pulse = 0.6 + Math.sin(t * p.speed + p.phase) * 0.4;
      const glow = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 8);
      glow.addColorStop(0, `hsla(${p.hue}, 100%, 65%, ${pulse})`);
      glow.addColorStop(1, `hsla(${p.hue}, 100%, 65%, 0)`);
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * 8, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = `hsla(${p.hue}, 100%, 85%, ${pulse})`;
      ctx.fill();
    }
  }
  else if (type === 'bubbles') {
    for (const p of currentParticles) {
      p.x += Math.sin(t * 0.5 + p.phase) * p.drift * dt;
      p.y -= p.speed * dt;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(200,240,255,${p.alpha})`;
      ctx.lineWidth = 1;
      ctx.stroke();
      if (p.y < -5) { p.y = canvasH + 5; p.x = Math.random() * canvasW; }
    }
  }
}

function animate(now) {
  const dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;
  renderParticles(dt);
  requestAnimationFrame(animate);
}
requestAnimationFrame(animate);

function applyScene(i, animateChange = true) {
  const scene = SCENES[i];
  const commit = () => {
    bgLayer.style.backgroundImage = scene.gradient;
    bgLayer.style.opacity = '1';
    currentParticleType = scene.particle;
    currentParticles = initParticles(currentParticleType, canvasW, canvasH);
    showToast(`🎨 ${scene.name}`);
  };
  if (animateChange) {
    bgLayer.style.opacity = '0';
    setTimeout(commit, 550);
  } else {
    commit();
  }
}

let toastTimer = null;
function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
}

/* ============================================================
   ⏱ ЯДРО
   ============================================================ */
let WORK = 25 * 60;
let BREAK = 5 * 60;
let timeLeft = WORK;
let isRunning = false;
let isWorkMode = true;
let timerInterval = null;
let sessionCount = 1;
let TOTAL_SESSIONS = 4;

const timeEl       = document.getElementById('time');
const modeEl       = document.getElementById('mode');
const ringEl       = document.getElementById('ring');
const ringGlowEl   = document.getElementById('ringGlow');
const sessionInfo  = document.getElementById('sessionInfo') || document.getElementById('session-info');
const startPauseBtn = document.getElementById('startPause');

const CIRCUMFERENCE = 2 * Math.PI * 92;
ringEl.style.strokeDasharray = CIRCUMFERENCE;
ringGlowEl.style.strokeDasharray = CIRCUMFERENCE;

function formatTime(sec) {
  sec = Math.max(0, sec);
  const m = Math.floor(sec / 60).toString().padStart(2, '0');
  const s = (sec % 60).toString().padStart(2, '0');
  return `${m}:${s}`;
}

function updateRing() {
  const total = isWorkMode ? WORK : BREAK;
  const progress = total > 0 ? Math.min(1, timeLeft / total) : 0;
  const offset = CIRCUMFERENCE * (1 - progress);
  ringEl.style.strokeDashoffset = offset;
  ringGlowEl.style.strokeDashoffset = offset;
}

function render() {
  timeEl.textContent = formatTime(timeLeft);
  updateRing();
  sessionInfo.textContent = `Сессия ${sessionCount} из ${TOTAL_SESSIONS}`;
}

function setAccent(color) {
  document.documentElement.style.setProperty('--accent', color);
}

function switchMode() {
  isWorkMode = !isWorkMode;
  timeLeft = isWorkMode ? WORK : BREAK;
  modeEl.textContent = isWorkMode ? 'Фокус' : 'Отдых';
  setAccent(isWorkMode ? '#ff6b6b' : '#4ecdc4');
  if (isWorkMode) sessionCount = Math.min(sessionCount + 1, TOTAL_SESSIONS);
  render();
}

function tick() {
  if (timeLeft > 0) {
    timeLeft--;
    render();
  } else {
    playChime();
    switchMode();
    pause();
  }
}

function start() {
  if (isRunning) return;
  isRunning = true;
  startPauseBtn.textContent = '❚❚';
  timerInterval = setInterval(tick, 1000);
}

function pause() {
  isRunning = false;
  startPauseBtn.textContent = '▶';
  clearInterval(timerInterval);
}

function reset() {
  pause();
  timeLeft = isWorkMode ? WORK : BREAK;
  render();
}

function skip() {
  pause();
  switchMode();
}

startPauseBtn.addEventListener('click', () => isRunning ? pause() : start());
document.getElementById('reset').addEventListener('click', reset);
document.getElementById('skip').addEventListener('click', skip);

/* ============================================================
   ➕ РУЧНОЕ ДОБАВЛЕНИЕ / УБАВЛЕНИЕ ВРЕМЕНИ
   ============================================================ */
document.querySelectorAll('.add-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const delta = parseInt(btn.dataset.add, 10);
    const newTime = timeLeft + delta;

    if (newTime <= 0) {
      showToast('⏱ Время не может быть отрицательным');
      timeLeft = 1;
    } else if (newTime > 999 * 60) {
      showToast('⏱ Слишком много времени');
      timeLeft = 999 * 60;
    } else {
      timeLeft = newTime;
      const sign = delta > 0 ? '+' : '';
      showToast(`⏱ ${sign}${Math.abs(delta) / 60} мин`);
    }

    if (isWorkMode && timeLeft > WORK) WORK = timeLeft;
    else if (!isWorkMode && timeLeft > BREAK) BREAK = timeLeft;

    render();
  });
});

/* ============================================================
   ⚙️ НАСТРОЙКИ
   ============================================================ */
const settingsPanel = document.getElementById('settingsPanel');
const workInput = document.getElementById('workInput');
const breakInput = document.getElementById('breakInput');
const sessionsInput = document.getElementById('sessionsInput');

function openSettings() {
  workInput.value = Math.round(WORK / 60);
  breakInput.value = Math.round(BREAK / 60);
  sessionsInput.value = TOTAL_SESSIONS;
  settingsPanel.classList.add('open');
}
function closeSettings() { settingsPanel.classList.remove('open'); }

document.getElementById('settingsBtn').addEventListener('click', openSettings);
document.getElementById('cancelSettings').addEventListener('click', closeSettings);
settingsPanel.addEventListener('click', (e) => { if (e.target === settingsPanel) closeSettings(); });

document.getElementById('applySettings').addEventListener('click', () => {
  const w = Math.max(1, Math.min(180, parseInt(workInput.value) || 25));
  const b = Math.max(1, Math.min(60,  parseInt(breakInput.value) || 5));
  const s = Math.max(1, Math.min(12,  parseInt(sessionsInput.value) || 4));

  WORK = w * 60;
  BREAK = b * 60;
  TOTAL_SESSIONS = s;
  sessionCount = Math.min(sessionCount, TOTAL_SESSIONS);

  pause();
  isWorkMode = true;
  modeEl.textContent = 'Фокус';
  setAccent('#ff6b6b');
  timeLeft = WORK;

  document.querySelectorAll('.preset').forEach(p => p.classList.remove('active'));

  render();
  closeSettings();
  showToast(`⚙ ${w} / ${b} · ${s} сессий`);
});

/* ============================================================
   🎯 ПРЕСЕТЫ
   ============================================================ */
document.querySelectorAll('.preset').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.preset').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    WORK = parseInt(btn.dataset.work) * 60;
    BREAK = parseInt(btn.dataset.break) * 60;
    isWorkMode = true;
    modeEl.textContent = 'Фокус';
    setAccent('#ff6b6b');
    pause();
    timeLeft = WORK;
    render();
  });
});

/* ============================================================
   🌊 ЗВУКИ
   ============================================================ */
let audioCtx = null;
let noiseSource = null;
let filter = null;
let gainNode = null;
let soundOn = false;
let soundTypeIndex = 0;
const SOUND_TYPES = ['rain', 'ocean', 'wind'];
const SOUND_LABELS = { rain: '🌧 Дождь', ocean: '🌊 Океан', wind: '🍃 Ветер' };

function createNoiseBuffer(ctx, type) {
  const bufferSize = ctx.sampleRate * 4;
  const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
  const data = buffer.getChannelData(0);
  if (type === 'rain') {
    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
  } else if (type === 'ocean') {
    let last = 0;
    for (let i = 0; i < bufferSize; i++) {
      const white = Math.random() * 2 - 1;
      last = (last + 0.02 * white) / 1.02;
      data[i] = last * 3.5;
    }
  } else {
    let b0 = 0, b1 = 0, b2 = 0;
    for (let i = 0; i < bufferSize; i++) {
      const white = Math.random() * 2 - 1;
      b0 = 0.99765 * b0 + white * 0.0990460;
      b1 = 0.96300 * b1 + white * 0.2965164;
      b2 = 0.57000 * b2 + white * 1.0526913;
      data[i] = (b0 + b1 + b2 + white * 0.1848) * 0.15;
    }
  }
  return buffer;
}

function startSound() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const type = SOUND_TYPES[soundTypeIndex];
  const buffer = createNoiseBuffer(audioCtx, type);
  noiseSource = audioCtx.createBufferSource();
  noiseSource.buffer = buffer;
  noiseSource.loop = true;
  filter = audioCtx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.value = type === 'rain' ? 4500 : (type === 'ocean' ? 700 : 900);
  filter.Q.value = 0.5;
  gainNode = audioCtx.createGain();
  gainNode.gain.value = 0;
  gainNode.gain.linearRampToValueAtTime(0.35, audioCtx.currentTime + 2);
  noiseSource.connect(filter).connect(gainNode).connect(audioCtx.destination);
  noiseSource.start();
}

function stopSound() {
  if (gainNode && audioCtx) {
    gainNode.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.6);
    const src = noiseSource;
    setTimeout(() => { if (src) { try { src.stop(); src.disconnect(); } catch(e){} } }, 700);
    noiseSource = null;
  }
}

function playChime() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const now = audioCtx.currentTime;
  [523.25, 659.25, 783.99].forEach((freq, i) => {
    const osc = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    g.gain.setValueAtTime(0, now + i * 0.15);
    g.gain.linearRampToValueAtTime(0.25, now + i * 0.15 + 0.05);
    g.gain.exponentialRampToValueAtTime(0.001, now + i * 0.15 + 1.2);
    osc.connect(g).connect(audioCtx.destination);
    osc.start(now + i * 0.15);
    osc.stop(now + i * 0.15 + 1.3);
  });
}

const soundBtn = document.getElementById('soundBtn');
soundBtn.addEventListener('click', () => {
  soundOn = !soundOn;
  if (soundOn) {
    startSound();
    soundBtn.classList.add('active');
    soundBtn.textContent = '🔊';
    showToast(SOUND_LABELS[SOUND_TYPES[soundTypeIndex]]);
  } else {
    stopSound();
    soundBtn.classList.remove('active');
    soundBtn.textContent = '🔇';
  }
});

soundBtn.addEventListener('dblclick', (e) => {
  e.stopPropagation();
  soundTypeIndex = (soundTypeIndex + 1) % SOUND_TYPES.length;
  showToast(SOUND_LABELS[SOUND_TYPES[soundTypeIndex]]);
  if (soundOn) { stopSound(); setTimeout(startSound, 750); }
});

/* ============================================================
   🎬 СМЕНА СЦЕНЫ + ХОТКЕИ
   ============================================================ */
document.getElementById('sceneBtn').addEventListener('click', () => {
  sceneIndex = (sceneIndex + 1) % SCENES.length;
  applyScene(sceneIndex);
});

document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT') return;
  if (settingsPanel.classList.contains('open') && e.key === 'Escape') {
    closeSettings();
    return;
  }
  switch (e.code) {
    case 'Space': e.preventDefault(); isRunning ? pause() : start(); break;
    case 'KeyR': reset(); break;
    case 'KeyS': skip();  break;
    case 'KeyB':
      sceneIndex = (sceneIndex + 1) % SCENES.length;
      applyScene(sceneIndex);
      break;
    case 'ArrowUp':
      e.preventDefault();
      document.querySelector('[data-add="60"]').click();
      break;
    case 'ArrowDown':
      e.preventDefault();
      document.querySelector('[data-add="-60"]').click();
      break;
  }
});

/* ============================================================
   🚀 СТАРТ
   ============================================================ */
window.addEventListener('resize', () => {
  resizeCanvas();
  currentParticles = initParticles(currentParticleType, canvasW, canvasH);
});

resizeCanvas();
setAccent('#ff6b6b');
render();
applyScene(sceneIndex, false);
</script>
